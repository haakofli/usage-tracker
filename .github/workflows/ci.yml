name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Cheap gates first, so a formatting slip fails in seconds rather than
      # after a full release build.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      - run: cargo build --release

      # Every build is downloadable from the run's Summary page, which is the
      # convenient path for the author: no release, no warnings story.
      - uses: actions/upload-artifact@v4
        with:
          name: usage-tracker-windows
          path: target/release/usage-tracker.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # Both architectures, joined with `lipo`: the runner is Apple Silicon, so
      # a plain release build would hand Intel Macs a binary they cannot run.
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - run: |
          lipo -create -output usage-tracker \
            target/aarch64-apple-darwin/release/usage-tracker \
            target/x86_64-apple-darwin/release/usage-tracker
          lipo -info usage-tracker

      - uses: actions/upload-artifact@v4
        with:
          name: usage-tracker-macos
          path: usage-tracker
          if-no-files-found: error

  release:
    # Tags only. Assets are unsigned, which the release notes say plainly.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Renamed on the way out so the two assets are told apart in the release,
      # and so the platform is obvious in a Downloads folder.
      - run: |
          mkdir -p dist
          cp artifacts/usage-tracker-windows/usage-tracker.exe dist/usage-tracker-windows.exe
          cp artifacts/usage-tracker-macos/usage-tracker dist/usage-tracker-macos
          chmod +x dist/usage-tracker-macos

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            | Download | For |
            | --- | --- |
            | `usage-tracker-windows.exe` | Windows 10/11 |
            | `usage-tracker-macos` | macOS, Apple Silicon and Intel |

            ## Unsigned builds

            Neither asset is code signed. Windows SmartScreen warns on first run
            (**More info → Run anyway**), and macOS refuses a downloaded binary
            until the quarantine flag is cleared:

            ```sh
            xattr -d com.apple.quarantine usage-tracker-macos
            chmod +x usage-tracker-macos
            ```

            This app reads your Claude OAuth token from
            `~/.claude/.credentials.json`. That is a good reason to be wary of
            any prebuilt binary that does the same. Building from source takes
            one command and is the recommended path:

            ```sh
            git clone https://github.com/haakofli/usage-tracker
            cd usage-tracker
            ./install.sh          # macOS
            .\install.ps1         # Windows
            ```
