[package]
name = "usage-tracker"
version = "0.1.0"
edition = "2024"
description = "A lightweight always-on-top dock showing how much Claude and Codex quota is left"
repository = "https://github.com/haakofli/usage-tracker"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
# `glow` (OpenGL) rather than eframe's default `wgpu` backend: measured on this
# machine at 117 MB resident and an 11 MB binary, against 278 MB and 19 MB for
# wgpu, with identical output. Footprint is the point of a dock that runs all
# day, so the GL backend is the right default here.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.36.2"
raw-window-handle = "0.6.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "http2", "charset", "system-proxy"] }
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tray-icon = { version = "0.24.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Registry"] }

# Not target-gated: a build script is compiled for the *host*, so gating this on
# the target would make it vanish exactly when cross-compiling from Windows to
# macOS, while build.rs still referenced it.
[build-dependencies]
winresource = "0.1.31"

# AppKit is reached through the same objc2 crates winit already uses, so the
# macOS backend adds bindings rather than a second window-system stack. Only the
# handful of headers it touches are enabled; the defaults are all of AppKit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSEvent", "NSResponder", "NSScreen", "NSView", "NSWindow"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
