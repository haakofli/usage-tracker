[package]
name = "usage-tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
# `glow` (OpenGL) rather than eframe's default `wgpu` backend: measured on this
# machine at 117 MB resident and an 11 MB binary, against 278 MB and 19 MB for
# wgpu, with identical output. Footprint is the point of a dock that runs all
# day, so the GL backend is the right default here.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.36.2"
raw-window-handle = "0.6.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "http2", "charset", "system-proxy"] }
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tray-icon = { version = "0.24.2", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }

[build-dependencies]
winresource = "0.1.31"
